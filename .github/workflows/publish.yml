on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install Pebble Tool & SDK
        run: |
          uv tool install pebble-tool
          pebble sdk install latest

      - name: Build Pebble App
        run: pebble build

      - name: Upload PBW artifact
        uses: actions/upload-artifact@v4
        with:
          name: pbw
          path: build/*.pbw
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: pbw }
      - run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://appstore-api.repebble.com" | jq -r .value)
          curl -fsS -H "Authorization: Bearer $TOKEN" \
            --form-string version=1.2.0 -F "pbwFile=@my-app.pbw" --form-string isPublished=true \
            https://appstore-api.repebble.com/api/dashboard/apps/818e20c1d8ce4adcb5590c5e/releases
