<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monzo App Settings</title>
  <style>
    :root {
      color-scheme: light dark;
      --coral: #FF5B35;
      --coral-hover: #E44825;
      --navy: #14233C;
      --card-bg: rgba(128, 128, 128, 0.08);
      --card-border: rgba(128, 128, 128, 0.2);
      --text-muted: rgba(128, 128, 128, 0.9);
      --green: #2ecc71;
      --amber: #f39c12;
      --red: #e74c3c;
    }

    body {
      font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px 20px 40px;
      color: inherit;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      background: var(--coral);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 22px;
      flex-shrink: 0;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 16px;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .status-badge.online {
      background: rgba(46, 204, 113, 0.15);
      color: var(--green);
    }

    .status-badge.warning {
      background: rgba(243, 156, 18, 0.15);
      color: var(--amber);
    }

    .status-badge.offline {
      background: rgba(231, 76, 60, 0.15);
      color: var(--red);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .instructions {
      font-size: 13px;
      line-height: 1.5;
      opacity: 0.8;
      margin: 10px 0 0;
    }

    .field {
      margin-bottom: 16px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      opacity: 0.85;
    }

    .field-hint {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 6px;
      line-height: 1.4;
    }

    select {
      box-sizing: border-box;
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      border-radius: 8px;
      border: 1px solid rgba(128, 128, 128, 0.4);
      background: rgba(128, 128, 128, 0.05);
      color: inherit;
    }

    select:focus {
      outline: 2px solid var(--coral);
      border-color: transparent;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: var(--coral);
      color: white;
      transition: background 0.15s ease, opacity 0.15s ease;
      width: 100%;
      margin-top: 8px;
    }

    .btn:hover {
      background: var(--coral-hover);
    }

    #status-msg {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      opacity: 0.75;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-badge">M</div>
    <div>
      <h1>Monzo App Settings</h1>
      <div class="subtitle">Watchapp Preferences</div>
    </div>
  </div>

  <!-- Plugin Status Card -->
  <div class="card">
    <h2>
      <span>Plugin Status</span>
      <span id="plugin-badge" class="status-badge warning">
        <span class="status-dot"></span>
        <span id="plugin-status-text">Checking…</span>
      </span>
    </h2>
    <div id="plugin-description" class="instructions">
      Connecting to background Monzo plugin…
    </div>
  </div>

  <!-- Theme Settings Card -->
  <div class="card">
    <h2>Display Theme</h2>
    <div class="field">
      <label for="theme-select">Watchface Style</label>
      <select id="theme-select">
        <option value="light">Light (Classic Pebble)</option>
        <option value="dark">Dark (Monzo Navy)</option>
      </select>
      <div class="field-hint">
        Applied across all watch screens and dialogs.
      </div>
    </div>
  </div>

  <!-- First Account Card -->
  <div class="card">
    <h2>First Account</h2>
    <div class="field">
      <label for="first-account-select">Primary Account on Wrist</label>
      <select id="first-account-select">
        <option value="">Default (First Available)</option>
      </select>
      <div class="field-hint">
        This account is shown when opening the watchapp. You can switch between all accounts using the Up/Down buttons.
      </div>
    </div>
  </div>

  <button id="btn-save" type="button" class="btn">Save Settings</button>
  <div id="status-msg"></div>

  <script>
    var $ = function (id) { return document.getElementById(id); };

    function say(text) {
      $('status-msg').textContent = text;
    }

    var availableAccounts = [];
    var selectedFirstAccountId = '';

    function getParam(name) {
      try {
        var match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
        return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
      } catch (e) {
        return null;
      }
    }

    function initFromLocalOrQuery() {
      // 1. Theme
      var savedTheme = getParam('theme') || localStorage.getItem('monzo_theme') || 'light';
      $('theme-select').value = (savedTheme === 'dark') ? 'dark' : 'light';

      // 2. First Account ID
      selectedFirstAccountId = getParam('firstAccount') || localStorage.getItem('monzo_first_account') || '';

      // 3. Status from Query if present
      var queryConfigured = getParam('configured');
      var queryStatus = getParam('status');
      var queryAccounts = getParam('accounts');

      if (queryAccounts) {
        try {
          var accs = JSON.parse(queryAccounts);
          if (Array.isArray(accs)) {
            renderAccounts(accs, selectedFirstAccountId);
          }
        } catch (e) {}
      }

      if (queryConfigured !== null) {
        updatePluginStatus(queryConfigured === '1', queryStatus || 'Ready');
      }
    }

    function updatePluginStatus(isConfigured, statusText) {
      var badge = $('plugin-badge');
      var statusSpan = $('plugin-status-text');
      var desc = $('plugin-description');

      badge.className = 'status-badge';
      if (isConfigured) {
        badge.classList.add('online');
        statusSpan.textContent = 'Connected';
        desc.innerHTML = 'The Monzo Pebble Plugin is active and serving real-time balance and pot data to your watch.';
      } else if (statusText === 'Sign in' || statusText === 'Setup') {
        badge.classList.add('warning');
        statusSpan.textContent = 'Setup Required';
        desc.innerHTML = 'The Monzo Pebble Plugin is not connected to your Monzo account. Please open the <strong>Monzo Plugin</strong> settings in the Pebble app to authorize your account.';
      } else if (statusText === 'No plugin API') {
        badge.classList.add('offline');
        statusSpan.textContent = 'API Unavailable';
        desc.innerHTML = 'Pebble Plugins API is not detected on your device. Please ensure you are running a supported Pebble app version with Plugins enabled.';
      } else {
        badge.classList.add('warning');
        statusSpan.textContent = statusText || 'Not Connected';
        desc.innerHTML = 'Monzo data is currently unavailable. Please verify your <strong>Monzo Pebble Plugin</strong> settings.';
      }
    }

    function renderAccounts(accounts, selectedId) {
      availableAccounts = accounts || [];
      var select = $('first-account-select');
      select.innerHTML = '';

      var defaultOpt = document.createElement('option');
      defaultOpt.value = '';
      defaultOpt.textContent = 'Default (First Available)';
      select.appendChild(defaultOpt);

      if (availableAccounts.length === 0) {
        var noneOpt = document.createElement('option');
        noneOpt.value = '';
        noneOpt.disabled = true;
        noneOpt.textContent = 'No accounts loaded (connect plugin first)';
        select.appendChild(noneOpt);
        return;
      }

      availableAccounts.forEach(function (acc) {
        var opt = document.createElement('option');
        opt.value = acc.id;
        var label = acc.name || 'Account';
        if (acc.balance) label += ' (' + acc.balance + ')';
        else if (acc.type) label += ' (' + acc.type + ')';
        opt.textContent = label;
        if (acc.id === selectedId) {
          opt.selected = true;
        }
        select.appendChild(opt);
      });
    }

    async function savePreferences() {
      var themeVal = $('theme-select').value;
      var firstAccVal = $('first-account-select').value;

      try {
        localStorage.setItem('monzo_theme', themeVal);
        localStorage.setItem('monzo_first_account', firstAccVal);
      } catch (e) {}

      say('Saving preferences…');

      if (typeof Pebble !== 'undefined' && Pebble.sendMessage) {
        try {
          await Pebble.sendMessage('pkjs', {
            type: 'setAppConfig',
            theme: themeVal,
            firstAccountId: firstAccVal
          });
        } catch (e) {}
      }

      say('Preferences saved!');

      var resultPayload = {
        theme: themeVal,
        firstAccountId: firstAccVal
      };

      setTimeout(function () {
        if (typeof Pebble !== 'undefined' && Pebble.openUrl) {
          document.location = 'pebblejs://close#' + encodeURIComponent(JSON.stringify(resultPayload));
        } else {
          document.location = 'pebblejs://close#' + encodeURIComponent(JSON.stringify(resultPayload));
        }
      }, 250);
    }

    $('btn-save').onclick = savePreferences;

    $('theme-select').onchange = function () {
      try { localStorage.setItem('monzo_theme', this.value); } catch (e) {}
    };

    $('first-account-select').onchange = function () {
      selectedFirstAccountId = this.value;
      try { localStorage.setItem('monzo_first_account', this.value); } catch (e) {}
    };

    initFromLocalOrQuery();

    if (typeof Pebble !== 'undefined' && Pebble.addEventListener) {
      Pebble.addEventListener('ready', async function (event) {
        console.log('[AppConfig] Pebble ready event:', event && event.target);
        if (Pebble.sendMessage) {
          try {
            var reply = await Pebble.sendMessage('pkjs', { type: 'getAppConfig' });
            if (reply) {
              if (reply.theme) {
                $('theme-select').value = reply.theme;
              }
              if (reply.firstAccountId !== undefined) {
                selectedFirstAccountId = reply.firstAccountId;
              }
              renderAccounts(reply.accounts, selectedFirstAccountId);
              updatePluginStatus(reply.isConfigured, reply.pluginStatus);
            }
          } catch (err) {
            console.warn('[AppConfig] getAppConfig error:', err);
          }
        }
      });
    }
  </script>
</body>
</html>
